<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kona</title>
  <meta name="theme-color" content="#1a1d22">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body data-state="start">
  <header class="top">
    <div class="brand" data-icon="logo" role="img" aria-label="Kona"></div>
    <button class="hd-btn" id="to-photo" data-icon="photo" aria-label="写真を撮る" title="写真を撮る"></button>
    <span class="status" id="status" hidden></span>
    <nav class="tabs" aria-label="表示">
      <a class="hd-btn" href="#home" id="tab-home" data-icon="home" aria-label="ホーム" title="ホーム"></a>
      <a class="hd-btn" href="#library" id="tab-library" data-icon="library" aria-label="ライブラリ" title="ライブラリ"></a>
      <a class="hd-btn" href="#settings" id="tab-settings" data-icon="settings" aria-label="設定" title="設定"></a>
    </nav>
    <div class="winctl" aria-label="ウィンドウ">
      <button class="hd-btn" id="to-mini" data-icon="mini" aria-label="最小表示" title="最小表示"></button>
      <button class="hd-btn" id="to-pip" data-icon="pip" aria-label="小窓で手前に出す" title="小窓で手前に出す" hidden></button>
    </div>
    <button class="hd-btn" id="invite" data-icon="invite" aria-label="招待" title="リスニングパーティー: 流している音をいっしょに聴く" hidden></button>
    <button class="hd-btn" id="open" data-icon="open" aria-label="フォルダ" title="フォルダ" aria-haspopup="menu"></button>
    <input type="file" id="picker" webkitdirectory multiple hidden>
  </header>
  <section class="start" id="start" aria-live="polite"></section>
  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-library" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
  <footer class="np np-host np-footer" id="np"></footer>
  <section id="mini" aria-label="最小表示"></section>
  <script type="module" src="/src/boot.ts"></script>
</body>
</html>
